</style></head><body><div class="layout"><aside class="side"><div><div class="logo">GO <em>Rentals</em></div><div class="sub" data-t="subtitle">Fleet Management</div></div><nav class="nav" id="nav"></nav><div class="bottom">GO Rentals • Independent trial<br><span data-t="offline">Saved on this device</span></div></aside><main class="main"><div class="top"><div><div class="eyebrow">GO Rentals / <span id="crumb"></span></div><h1 class="heading" id="heading"></h1></div><div class="actions"><select class="lang" id="lang"><option value="en">English</option><option value="es">Español</option></select><button class="btn" id="backup" data-t="export">Export backup</button><button class="btn" id="restore" data-t="import">Import backup</button><input type="file" accept=".json,application/json" id="file" hidden></div></div><div id="content"></div></main></div><div id="modalRoot"></div><script>
(()=>{'use strict';const KEY='go_rentals_independent_v1';const initialVehicles=[['Mitsubishi','Sportero',2017,'','M280357','pickup',85.32],['Toyota','Corolla',2019,'Chocolate','M411649','sedan',55.68],['Hyundai','Tucson',2021,'Gray','M386243','suv',58.78],['Hyundai','Tucson',2022,'White','M351430','suv',58.14],['Hyundai','Tucson',2023,'White','M372389','suv',53.56],['Toyota','Corolla',2019,'Blue','M416117','sedan',60.08],['Mitsubishi','L200',2024,'','M457950','pickup',61.62],['Toyota','Raize',2026,'','M471235','mini',39.39]];const rates={sedan:40,mini:45,suv:60,pickup:75,luxury:80};const uid=()=>crypto.randomUUID?crypto.randomUUID():'id'+Date.now()+Math.random().toString(36).slice(2);const seed=()=>({vehicles:initialVehicles.map(v=>({id:uid(),make:v[0],model:v[1],year:v[2],color:v[3],plate:v[4],category:v[5],insurance:v[6],loan:0,loanPayment:0,ownership:'owned'})),customers:[],rentals:[],expenses:[],language:'en'});let db;try{db=JSON.parse(localStorage.getItem(KEY))||seed()}catch{db=seed()}for(const k of ['vehicles','customers','rentals','expenses'])if(!Array.isArray(db[k]))db[k]=[];let page='dashboard';const save=()=>localStorage.setItem(KEY,JSON.stringify(db));save();const txt={en:{subtitle:'Fleet Management',offline:'Saved on this device',dashboard:'Dashboard',vehicles:'Vehicles',customers:'Customers',rentals:'Rentals',expenses:'Expenses',reports:'Reports',export:'Export backup',import:'Import backup',add:'Add new',edit:'Edit',delete:'Delete',save:'Save',cancel:'Cancel',totalVehicles:'Total vehicles',rented:'Currently rented',revenue:'Rental revenue',insurance:'Monthly insurance',activity:'Recent rentals',fleet:'Fleet overview',monthly:'This month',noRecords:'No records yet',vehicle:'Vehicle',customer:'Customer',phone:'Phone number',dates:'Dates',amount:'Total',status:'Status',category:'Category',plate:'License plate',rate:'Daily rate',actions:'Actions',expense:'Expense',notes:'Notes',financial:'Monthly cash surplus',allTime:'Current month rental charges',overlap:'Vehicle already booked during these dates',confirm:'Delete this record?',test:'Trial version: records stay in this browser only. Export regular backups. This is not yet a private, synchronized online system.'},es:{subtitle:'Administración de flota',offline:'Guardado en este dispositivo',dashboard:'Panel principal',vehicles:'Vehículos',customers:'Clientes',rentals:'Alquileres',expenses:'Gastos',reports:'Reportes',export:'Exportar respaldo',import:'Importar respaldo',add:'Agregar nuevo',edit:'Editar',delete:'Eliminar',save:'Guardar',cancel:'Cancelar',totalVehicles:'Total de vehículos',rented:'Actualmente alquilados',revenue:'Ingresos de alquileres',insurance:'Seguro mensual',activity:'Alquileres recientes',fleet:'Resumen de flota',monthly:'Este mes',noRecords:'Sin registros todavía',vehicle:'Vehículo',customer:'Cliente',phone:'Teléfono',dates:'Fechas',amount:'Total',status:'Estado',category:'Categoría',plate:'Placa',rate:'Precio diario',actions:'Acciones',expense:'Gasto',notes:'Notas',financial:'Excedente de efectivo mensual',allTime:'Alquileres de este mes',overlap:'El vehículo ya está reservado en esas fechas',confirm:'¿Eliminar este registro?',test:'Versión de prueba: los registros solo se guardan en este navegador. Exporte respaldos. Todavía no es un sistema en línea sincronizado.'}};const t=k=>txt[db.language]?.[k]||txt.en[k]||k;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const usd=n=>'$'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});const vname=v=>v?`${v.year} ${v.make} ${v.model}`:'—';const byId=(set,id)=>db[set].find(x=>x.id===id);const iso=d=>new Date(d+'T12:00:00');const days=(a,b)=>Math.max(1,Math.round((iso(b)-iso(a))/86400000));const month=new Date().toISOString().slice(0,7);const monthlyRents=()=>db.rentals.filter(r=>r.pickup.slice(0,7)===month);const monthExpenses=()=>db.expenses.filter(e=>e.date?.slice(0,7)===month);const insTotal=()=>db.vehicles.reduce((n,v)=>n+Number(v.insurance||0),0);const select=(a,selected,placeholder)=>`<option value="">${esc(placeholder)}</option>`+a.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.label)}</option>`).join('');const header=(name,action)=>`<div class="section-head"><h3>${esc(name)}</h3>${action?`<button class="btn primary" data-action="new" data-kind="${action}">+ ${t('add')}</button>`:''}</div>`;const table=(headers,rows)=>`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">${t('noRecords')}</td></tr>`}</tbody></table></div>`;const act=(kind,id)=>`<button class="mini" data-action="edit" data-kind="${kind}" data-id="${id}">${t('edit')}</button><button class="mini red" data-action="del" data-kind="${kind}" data-id="${id}">${t('delete')}</button>`;
function render(){document.documentElement.lang=db.language;document.querySelector('#lang').value=db.language;document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));const nav=['dashboard','vehicles','customers','rentals','expenses','reports'];document.querySelector('#nav').innerHTML=nav.map(x=>`<button class="${page===x?'active':''}" data-page="${x}">${({dashboard:'▦',vehicles:'🚙',customers:'♙',rentals:'▣',expenses:'▤',reports:'▥'})[x]} &nbsp;${t(x)}</button>`).join('');document.querySelector('#heading').textContent=t(page);document.querySelector('#crumb').textContent=t(page);const today=new Date().toISOString().slice(0,10);const active=db.rentals.filter(r=>r.status!=='returned'&&r.pickup<=today&&r.dropoff>today).length;const rev=monthlyRents().reduce((n,r)=>n+Number(r.total||0),0);const expense=monthExpenses().reduce((n,e)=>n+Number(e.amount||0),0);const loan=db.vehicles.reduce((n,v)=>n+Number(v.loanPayment||0),0);let html=`<div class="notice">${t('test')}</div>`;if(page==='dashboard'){html+=`<div class="cards"><div class="card"><small>${t('totalVehicles')}</small><strong>${db.vehicles.length}</strong><span>${t('fleet')}</span></div><div class="card"><small>${t('rented')}</small><strong>${active}</strong><span>${today}</span></div><div class="card"><small>${t('revenue')}</small><strong>${usd(rev)}</strong><span>${t('monthly')}</span></div><div class="card"><small>${t('insurance')}</small><strong>${usd(insTotal())}</strong><span>${t('monthly')}</span></div></div><div class="grid2"><div class="panel">${header(t('fleet'),'vehicle')}${table([t('vehicle'),t('plate'),t('category'),t('rate')],db.vehicles.map(v=>`<tr><td><strong>${esc(vname(v))}</strong></td><td>${esc(v.plate)}</td><td>${esc(v.category)}</td><td>${usd(rates[v.category])}</td></tr>`).join(''))}</div><div class="panel"><h3>${t('monthly')}</h3><div class="rowstat"><span>${t('revenue')}</span><strong>${usd(rev)}</strong></div><div class="rowstat"><span>${t('expenses')}</span><strong>${usd(expense)}</strong></div><div class="rowstat"><span>${t('insurance')}</span><strong>${usd(insTotal())}</strong></div><div class="rowstat"><span>Loan payments / Préstamos</span><strong>${usd(loan)}</strong></div><hr><div class="rowstat"><strong>${t('financial')}</strong><strong>${usd(rev-expense-insTotal()-loan)}</strong></div><p class="help">Cash illustration, not accounting profit. Revenue is assigned here by pickup month; the final website should allocate it by rental day.</p></div></div>`}if(page==='vehicles')html+=`<div class="panel">${header(t('vehicles'),'vehicle')}${table([t('vehicle'),t('plate'),t('category'),t('insurance'),'Loan balance',''],db.vehicles.map(v=>`<tr><td><strong>${esc(vname(v))}</strong><div class="muted">${esc(v.color)}</div></td><td>${esc(v.plate)}</td><td>${esc(v.category)}</td><td>${usd(v.insurance)}</td><td>${usd(v.loan)}</td><td>${act('vehicle',v.id)}</td></tr>`).join(''))}</div>`;if(page==='customers')html+=`<div class="panel">${header(t('customers'),'customer')}${table(['Name / Nombre',t('phone'),'Email',''],db.customers.map(c=>`<tr><td><strong>${esc(c.name)}</strong></td><td>${esc(c.phone)}</td><td>${esc(c.email)}</td><td>${act('customer',c.id)}</td></tr>`).join(''))}</div>`;if(page==='rentals')html+=`<div class="panel">${header(t('rentals'),'rental')}${table([t('vehicle'),t('customer'),t('phone'),t('dates'),t('amount'),t('status'),''],db.rentals.map(r=>`<tr><td>${esc(vname(byId('vehicles',r.vehicleId)))}</td><td>${esc(byId('customers',r.customerId)?.name)}</td><td>${esc(r.phone)}</td><td>${esc(r.pickup)} → ${esc(r.dropoff)}</td><td>${usd(r.total)}</td><td><span class="tag ${r.status==='returned'?'out':''}">${esc(r.status)}</span></td><td>${act('rental',r.id)}</td></tr>`).join(''))}</div>`;if(page==='expenses')html+=`<div class="panel">${header(t('expenses'),'expense')}${table(['Date',t('vehicle'),t('category'),t('notes'),t('amount'),''],db.expenses.map(e=>`<tr><td>${esc(e.date)}</td><td>${esc(vname(byId('vehicles',e.vehicleId)))}</td><td>${esc(e.category)}</td><td>${esc(e.notes)}</td><td>${usd(e.amount)}</td><td>${act('expense',e.id)}</td></tr>`).join(''))}</div>`;if(page==='reports')html+=`<div class="panel"><h3>${t('monthly')} — ${month}</h3>${table([t('vehicle'),t('revenue'),t('expenses'),t('insurance'),'Loan payment',t('financial')],db.vehicles.map(v=>{const r=monthlyRents().filter(r=>r.vehicleId===v.id).reduce((n,r)=>n+Number(r.total||0),0),e=monthExpenses().filter(e=>e.vehicleId===v.id).reduce((n,e)=>n+Number(e.amount||0),0),i=Number(v.insurance||0),l=Number(v.loanPayment||0);return `<tr><td>${esc(vname(v))}</td><td>${usd(r)}</td><td>${usd(e)}</td><td>${usd(i)}</td><td>${usd(l)}</td><td><strong>${usd(r-e-i-l)}</strong></td></tr>`}).join(''))}<p class="help">Monthly revenue currently groups by pickup month; this preview is not yet suitable for final financial reporting on rentals spanning multiple months.</p></div>`;document.querySelector('#content').innerHTML=html}
const field=(label,name,value='',type='text',extra='')=>`<div class="field"><label for="f_${name}">${esc(label)}</label><input id="f_${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;const pick=(label,name,options,value)=>`<div class="field"><label>${esc(label)}</label><select name="${name}" id="f_${name}">${options.map(o=>`<option value="${esc(o[0])}" ${o[0]===value?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;const cPick=id=>pick(t('customer'),'customerId',[['','— Select —'],...db.customers.map(c=>[c.id,c.name])],id||'');const vPick=id=>pick(t('vehicle'),'vehicleId',[['','— Select —'],...db.vehicles.map(v=>[v.id,vname(v)+' • '+v.plate])],id||'');function form(kind,id){const current=byId(kind==='vehicle'?'vehicles':kind==='customer'?'customers':kind==='rental'?'rentals':'expenses',id)||{};let fields='';if(kind==='vehicle')fields=field('Make / Marca','make',current.make,'text','required')+field('Model / Modelo','model',current.model,'text','required')+field('Year / Año','year',current.year||2026,'number','required min="1980" max="2100"')+field('Color','color',current.color)+field(t('plate'),'plate',current.plate,'text','required')+pick(t('category'),'category',Object.keys(rates).map(k=>[k,k]),current.category||'sedan')+field('Insurance USD/month','insurance',current.insurance??0,'number','min="0" step="0.01"')+pick('Ownership / Propiedad','ownership',[['owned','Fully owned'],['financed','Financed']],current.ownership||'owned')+field('Loan balance USD','loan',current.loan??0,'number','min="0" step="0.01"')+field('Loan payment USD/month','loanPayment',current.loanPayment??0,'number','min="0" step="0.01"');if(kind==='customer')fields=field('Name / Nombre','name',current.name,'text','required')+field(t('phone'),'phone',current.phone,'tel')+field('Email','email',current.email,'email');if(kind==='expense')fields=field('Date / Fecha','date',current.date||new Date().toISOString().slice(0,10),'date','required')+vPick(current.vehicleId)+pick(t('category'),'category',[['maintenance','Maintenance'],['repair','Repair'],['insurance','Insurance (one-time)'],['other','Other']],current.category||'maintenance')+field(t('amount')+' USD','amount',current.amount??0,'number','min="0" step="0.01" required')+field(t('notes'),'notes',current.notes);if(kind==='rental')fields=vPick(current.vehicleId)+cPick(current.customerId)+field(t('phone'),'phone',current.phone)+field('Pickup / Entrega','pickup',current.pickup||new Date().toISOString().slice(0,10),'date','required')+field('Return / Devolución','dropoff',current.dropoff||new Date(Date.now()+86400000).toISOString().slice(0,10),'date','required')+field(t('rate')+' USD','rate',current.rate??40,'number','min="0" step="0.01" required')+pick('Discount type / Descuento','discountType',[['none','None'],['fixed','Fixed USD'],['percent','Percent %']],current.discountType||'none')+field('Discount amount','discount',current.discount??0,'number','min="0" step="0.01"')+pick(t('status'),'status',[['reserved','Reserved'],['rented','Rented'],['returned','Returned']],current.status||'reserved')+field('Starting odometer (km)','odometerStart',current.odometerStart??'','number','min="0"')+field('Return odometer (km)','odometerEnd',current.odometerEnd??'','number','min="0"')+field('Extra charges USD','extras',current.extras??0,'number','min="0" step="0.01"')+field('Payment collected USD','paid',current.paid??0,'number','min="0" step="0.01"')+field(t('notes'),'notes',current.notes);document.querySelector('#modalRoot').innerHTML=`<div class="overlay"><div class="modal"><h3>${id?t('edit'):t('add')} — ${t(kind==='vehicle'?'vehicles':kind==='customer'?'customers':kind==='rental'?'rentals':'expenses')}</h3><form id="recordForm" data-kind="${kind}" data-id="${id||''}"><div class="fields">${fields}</div><div class="foot"><button type="button" class="btn" id="dismiss">${t('cancel')}</button><button class="btn primary" type="submit">${t('save')}</button></div></form></div></div>`;document.querySelector('#dismiss').onclick=()=>document.querySelector('#modalRoot').innerHTML='';if(kind==='rental'){const vSel=document.querySelector('#f_vehicleId'),rateEl=document.querySelector('#f_rate'),phoneEl=document.querySelector('#f_phone');if(!id){vSel.onchange=()=>{const v=byId('vehicles',vSel.value);if(v)rateEl.value=rates[v.category]||0};document.querySelector('#f_customerId').onchange=e=>{const c=byId('customers',e.target.value);phoneEl.value=c?.phone||''};}if(!id && db.vehicles.length){vSel.value=db.vehicles[0].id;rateEl.value=rates[db.vehicles[0].category]}}document.querySelector('#recordForm').onsubmit=submit}
function submit(ev){ev.preventDefault();const f=ev.currentTarget,kind=f.dataset.kind,id=f.dataset.id,data=Object.fromEntries(new FormData(f).entries());let set=kind==='vehicle'?'vehicles':kind==='customer'?'customers':kind==='rental'?'rentals':'expenses';if(kind==='vehicle'){data.year=Number(data.year);for(let k of ['insurance','loan','loanPayment'])data[k]=Number(data[k]||0);if(db.vehicles.some(v=>v.plate.toUpperCase()===data.plate.trim().toUpperCase()&&v.id!==id)){alert('License plate already exists');return}}if(kind==='expense')data.amount=Number(data.amount);if(kind==='rental'){if(!data.vehicleId||!data.customerId){alert('Choose a vehicle and customer');return}if(data.dropoff<=data.pickup){alert('Return date must be later than pickup date');return}const overlaps=db.rentals.some(r=>r.id!==id&&r.vehicleId===data.vehicleId&&r.status!=='returned'&&data.pickup<r.dropoff&&data.dropoff>r.pickup);if(overlaps){alert(t('overlap'));return}for(const k of ['rate','discount','extras','paid'])data[k]=Number(data[k]||0);const subtotal=days(data.pickup,data.dropoff)*data.rate;const cut=data.discountType==='fixed'?data.discount:data.discountType==='percent'?subtotal*data.discount/100:0;if(data.discountType==='percent'&&data.discount>100){alert('Discount cannot exceed 100%');return}data.total=Math.max(0,subtotal-Math.min(subtotal,cut))+data.extras;if(data.paid>data.total){alert('Payment exceeds total');return}}if(id){const index=db[set].findIndex(x=>x.id===id);if(index>=0)db[set][index]={...db[set][index],...data}}else db[set].push({id:uid(),...data});save();document.querySelector('#modalRoot').innerHTML='';render()}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.page){page=button.dataset.page;render()}if(button.dataset.action==='new')form(button.dataset.kind);if(button.dataset.action==='edit')form(button.dataset.kind,button.dataset.id);if(button.dataset.action==='del'){if(!confirm(t('confirm')))return;const set=({vehicle:'vehicles',customer:'customers',rental:'rentals',expense:'expenses'})[button.dataset.kind],id=button.dataset.id;if(set==='vehicles'&&(db.rentals.some(r=>r.vehicleId===id)||db.expenses.some(e=>e.vehicleId===id))){alert('Vehicle has linked records');return}if(set==='customers'&&db.rentals.some(r=>r.customerId===id)){alert('Customer has linked rentals');return}db[set]=db[set].filter(x=>x.id!==id);save();render()}});document.querySelector('#lang').onchange=e=>{db.language=e.target.value;save();render()};document.querySelector('#backup').onclick=()=>{const file=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download='GO_Rentals_backup_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.querySelector('#restore').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=async e=>{try{const raw=JSON.parse(await e.target.files[0].text());if(!['vehicles','rentals','customers','expenses'].every(k=>Array.isArray(raw[k])))throw Error('Invalid backup format');if(confirm('Replace all saved records on this device with the imported backup?')){db=raw;db.language=db.language==='es'?'es':'en';save();render()}}catch(err){alert('Import failed: '+err.message)}e.target.value=''};render();})();
